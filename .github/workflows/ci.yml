# Continuous integration for the showcase.
# Every project with a test suite runs it on each push and pull request.
# Windows-only tools (tray app, dictation tool) run on a Windows runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  lint:
    name: Lint (ruff)
    needs: secrets          # a leaked key stops the run before any test starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check --output-format=github .
      - name: Self-tests of the CI scripts
        run: |
          pip install pytest "PyYAML>=6.0,<7"
          python -m pytest -q -p no:cacheprovider .github/scripts
      - name: Actions are pinned to a commit SHA
        run: python .github/scripts/ci_pinned_actions.py .github/workflows

  python-tests:
    name: Tests · ${{ matrix.name }}
    needs: secrets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orbitdesk
            os: windows-latest
            dir: projects/orbitdesk
            install: pip install -e ".[leiste,dev]"
            test: python -m pytest -q
          - name: typefree
            os: windows-latest
            dir: tools/typefree
            install: pip install -r windows/requirements.txt -r windows/requirements-dev.txt
            test: python -m pytest -q windows/tests
          - name: readfree
            os: windows-latest
            dir: tools/readfree
            install: pip install -r requirements.txt pytest
            test: python -m pytest -q tests
          - name: foundry-demos
            os: ubuntu-latest
            dir: tools/foundry-demos
            install: pip install -r requirements-dev.txt -r shared_core/requirements_azure.txt
            test: python -m pytest -q --disable-socket --allow-unix-socket --allow-hosts=localhost,127.0.0.1,::1 tests
          - name: concertify
            os: ubuntu-latest
            dir: projects/concertify
            install: pip install -r requirements.txt pytest
            test: python -m pytest -q tests
          - name: cross-model-review
            os: ubuntu-latest
            dir: projects/cross-model-review
            install: pip install pytest
            test: python -m pytest -q tests
          - name: rag-knowledge-base
            os: ubuntu-latest
            dir: projects/rag-knowledge-base
            install: pip install pytest -r requirements.txt
            test: python -m pytest -q tests
          - name: personal-ai-agent
            os: ubuntu-latest
            dir: projects/personal-ai-agent/backend
            install: pip install -r requirements.txt -r requirements-dev.txt
            test: python -m pytest -q tests
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: ${{ matrix.install }}
      - run: pip install pytest-cov
      # JUnit and coverage report per suite, both kept as an artifact for 14 days. The coverage data file goes
      # to the runner's temp folder so the working tree stays as it was.
      - name: pytest
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: >-
          ${{ matrix.test }} -p no:cacheprovider -o junit_family=xunit1
          --junitxml=${{ runner.temp }}/reports/junit.xml
          --cov=. --cov-report=xml:${{ runner.temp }}/reports/coverage.xml
      # Job summary: every test with its result, skipped ones with their reason, line coverage per module.
      # It never fails the job; green or red is decided by the pytest step above. The script itself exits 0 on
      # unreadable reports or an unwritable summary; continue-on-error also covers anything else.
      - name: Test report
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SUITE: ${{ matrix.name }}
        run: >-
          python "$GITHUB_WORKSPACE/.github/scripts/ci_test_report.py" --title "$SUITE"
          --junit "$RUNNER_TEMP/reports/junit.xml" --coverage "$RUNNER_TEMP/reports/coverage.xml"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.name }}
          path: ${{ runner.temp }}/reports/
          if-no-files-found: warn
          retention-days: 14

  shotreader:
    name: ShotReader · PowerShell self-test
    needs: secrets
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/shotreader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test (rules, fingerprint, local OCR and speech; no network)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\ShotReader.ps1 -Test

  c-university:
    name: C · university foundations (2020 code, characterization tests)
    needs: secrets
    # Windows: the 2020 code uses scanf_s from the Microsoft C runtime. clang ships with the runner image.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: projects/university-foundations/mail-order-c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: clang --version
      - run: CC=clang bash check.sh

  javascript:
    name: JavaScript syntax
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: node --check on every script
        run: |
          find projects tools -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
      - name: Lockfile in sync · document-automation (no install scripts)
        working-directory: projects/document-automation
        run: npm ci --ignore-scripts
      - name: Tests · document-automation (node:test)
        working-directory: projects/document-automation
        run: node --test

  sonos-demo:
    name: Sonos simulation · tests, validator and browser QA
    needs: secrets
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Playwright in runner temp without install scripts
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/sonos-demo-browser" --ignore-scripts playwright@1.62.1
      - name: State contract tests
        run: node --test projects/sonos-music-drop/demo/ducker.test.js
      - name: Showcase and local reference validation
        run: node scripts/verify-showcase.mjs
      - name: Negative remote CSS fixture
        run: node --test scripts/verify-showcase.test.mjs
      - name: Browser QA in installed Edge
        shell: pwsh
        env:
          NODE_PATH: ${{ runner.temp }}/sonos-demo-browser/node_modules
          SONOS_QA_DIR: ${{ runner.temp }}/sonos-demo-preview
        run: node projects/sonos-music-drop/demo/browser-check.cjs
